name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: assembleRelease (con recuento de warnings)
        shell: bash
        run: |
          ./gradlew assembleRelease assembleDebug --rerun-tasks --warning-mode all 2>&1 | tee build.log
          echo "## Warnings de compilación" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^w: ' build.log > warnings.txt || true
          if [ -s warnings.txt ]; then cat warnings.txt >> "$GITHUB_STEP_SUMMARY"; else echo "Ninguno" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Kotlin warnings: $(wc -l < warnings.txt)"

      - name: Lint de Android
        run: ./gradlew lintRelease --stacktrace

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            build.log
            warnings.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: telepropia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
