name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (vX.Y.Z). Vacío: solo compila y prueba."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clave de firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TELEPROPIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TELEPROPIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TELEPROPIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TELEPROPIA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "TELEPROPIA_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "TELEPROPIA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TELEPROPIA_KEY_ALIAS=$KEY_ALIAS"
              echo "TELEPROPIA_KEY_PASSWORD=$KEY_PASSWORD"
              echo "FIRMA=definitiva"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/temporal.jks" -alias temporal -keyalg RSA -keysize 2048 \
              -validity 30 -storepass temporal -keypass temporal -dname "CN=CI temporal" >/dev/null
            {
              echo "TELEPROPIA_KEYSTORE=$RUNNER_TEMP/temporal.jks"
              echo "TELEPROPIA_KEYSTORE_PASSWORD=temporal"
              echo "TELEPROPIA_KEY_ALIAS=temporal"
              echo "TELEPROPIA_KEY_PASSWORD=temporal"
              echo "FIRMA=temporal"
            } >> "$GITHUB_ENV"
            echo "::warning::Sin secretos de firma: el release va firmado con una clave temporal del CI."
          fi

      - name: ktlint
        run: ./gradlew ktlintCheck --continue

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --continue

      - name: assembleRelease (con recuento de warnings)
        shell: bash
        run: |
          ./gradlew assembleRelease --warning-mode all 2>&1 | tee build.log
          echo "## Warnings de compilación (firma $FIRMA)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^w: ' build.log > warnings.txt || true
          if [ -s warnings.txt ]; then cat warnings.txt >> "$GITHUB_STEP_SUMMARY"; else echo "Ninguno" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Kotlin warnings: $(wc -l < warnings.txt)"
          ls -la app/build/outputs/apk/release/

      - name: SQL de la migración igual que el de Room
        run: python3 .github/scripts/check_room_sql.py

      - name: Lint de Android
        run: ./gradlew lintRelease

      - name: Avisos de lint en el log
        if: always()
        run: find app/build -name 'lint-results-release.txt' -exec cat {} \; || true

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            build.log
            warnings.txt
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
          if-no-files-found: ignore

      - name: APK release
        uses: actions/upload-artifact@v4
        with:
          name: telepropia-release-firma-${{ env.FIRMA }}
          path: app/build/outputs/apk/release/*.apk

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: telepropia-release-firma-*
          path: apk
          merge-multiple: true

      - name: KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Vídeo HLS de prueba
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p "$RUNNER_TEMP/hls"
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 600 -c:v libx264 -preset veryfast \
            -pix_fmt yuv420p -g 50 -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "$RUNNER_TEMP/hls/seg%03d.ts" "$RUNNER_TEMP/hls/index.m3u8"
          ls "$RUNNER_TEMP/hls" | wc -l
          ls apk

      - name: Emulador Android TV y recorrido completo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/e2e.py "$(ls apk/*universal*.apk)" "$RUNNER_TEMP/hls" "$RUNNER_TEMP/capturas"

      - name: Capturas del recorrido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore

  desktop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Tests del núcleo
        run: npm test

      - name: Interfaz
        run: npm run build

      - name: Vídeo HLS VP9 de prueba
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p "$RUNNER_TEMP/hls-vp9"
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 120 -c:v libvpx-vp9 -deadline realtime \
            -cpu-used 8 -b:v 500k -g 50 -f hls -hls_time 2 -hls_list_size 0 -hls_segment_type fmp4 \
            -hls_fmp4_init_filename init.mp4 -hls_segment_filename "$RUNNER_TEMP/hls-vp9/seg%03d.m4s" \
            "$RUNNER_TEMP/hls-vp9/index.m3u8"

      - name: Chromium para el E2E
        run: npx playwright install --with-deps chromium

      - name: E2E de escritorio contra dos resolvers falsos
        run: npm run e2e -- "$RUNNER_TEMP/hls-vp9" "$RUNNER_TEMP/capturas-escritorio"

      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-escritorio
          path: ${{ runner.temp }}/capturas-escritorio
          if-no-files-found: ignore

  desktop-build:
    needs: desktop-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            bundle: desktop/src-tauri/target/release/bundle/nsis/*.exe
            name: telepropia-windows
          - os: macos-latest
            args: "--target universal-apple-darwin"
            bundle: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            name: telepropia-mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencias
        working-directory: desktop
        run: npm ci

      - name: Instalador
        working-directory: desktop
        shell: bash
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [build, e2e, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: telepropia-release-firma-*
          path: apk
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: telepropia-{windows,mac}
          path: escritorio
          merge-multiple: true

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_REF_NAME es de GitHub y no se puede sobrescribir: la versión va en su propia variable.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Nombre fijo además del versionado: .../releases/latest/download/telepropia.apk no cambia nunca.
          cp apk/app-universal-release.apk apk/telepropia.apk
          cp apk/app-universal-release.apk "apk/telepropia-${VERSION}.apk"
          # Nombres fijos también para escritorio: el enlace "latest/download" no cambia entre versiones.
          cp escritorio/*.exe TelePropia-Windows.exe
          cp escritorio/*.dmg TelePropia-Mac.dmg
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --title "TelePropia $VERSION" \
            --target "$GITHUB_SHA" --generate-notes apk/telepropia.apk "apk/telepropia-${VERSION}.apk" \
            TelePropia-Windows.exe TelePropia-Mac.dmg
